<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Plumbing Services | Johannesburg</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="hero">
    <div class="container">
      <span class="badge">24/7 Rapid Response</span>
      <h1>Fast Emergency Plumbing in Your Area</h1>
      <p>Burst pipes, geysers, and blocked drains repaired by certified local experts.</p>
      <a href="tel:0821234567" class="btn btn-primary">Call Now: 082 123 4567</a>
    </div>
  </header>

  <section class="form-section container">
    <h2>Request an Immediate Callback</h2>
    <!-- You will replace FORMSPREE_ID in Step 4 -->
    <form action="https://formspree.io/f/mljdzben" method="POST">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label for="phone">WhatsApp / Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="082 123 4567" required>
      </div>

      <div class="form-group">
        <label for="service">Required Service</label>
        <select id="service" name="service" required>
          <option value="">Choose an issue...</option>
          <option value="Geyser">Geyser Issue</option>
          <option value="Blocked Drain">Blocked Drain</option>
          <option value="Leak">Water Leak</option>
        </select>
      </div>

      <button type="submit" class="btn btn-secondary">Request Call</button>
    </form>
  </section>

  <!-- Sticky WhatsApp Button -->
  <a href="https://wa.me/27821234567?text=Hi,%20I%20need%20a%20plumbing%20quote" 
     class="whatsapp-float" 
     target="_blank">
     Chat on WhatsApp
  </a>

</body>
</html>
